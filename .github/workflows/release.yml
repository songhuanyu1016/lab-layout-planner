name: Build Windows Release

# Push a tag like v1.0.0 to build LabLayoutPlanner.exe and publish a
# GitHub Release with the zipped app attached.
# "Run workflow" (manual) builds the zip as a downloadable artifact only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build exe (build_exe.bat)
        shell: cmd
        run: call build_exe.bat

      - name: Zip app folder
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          $zip = "LabLayoutPlanner-$name-win64.zip"
          7z a -tzip -mx=5 $zip .\dist\LabLayoutPlanner | Out-Null
          "ZIP=$zip" >> $env:GITHUB_ENV
          Get-Item $zip | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: LabLayoutPlanner-win64
          path: ${{ env.ZIP }}
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
